# Поднимает обе части сразу: Next из этого репозитория и API из соседнего.
#
#   projects/
#   ├─ berkun-dzencode-test   ← этот репозиторий
#   └─ berkun-dzencode-api
#
#   docker compose -f docker-compose.full.yml up
#
# Обычный `docker compose up` поднимает только фронт и соседнюю папку не
# требует — файлы разделены, чтобы репозиторий оставался самодостаточным.

services:
  api:
    image: dzencode-api
    container_name: dzencode-api
    build:
      context: ../berkun-dzencode-api
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
    volumes:
      # `dist` намеренно не в томе, см. комментарий в compose бэкенда.
      - ../berkun-dzencode-api:/app
      - api_node_modules:/app/node_modules

  nextjs-app:
    image: nextjs-app
    container_name: nextjs-app
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      # Браузер обращается к API с хоста, поэтому localhost, а не имя сервиса.
      # TODO(2.1): при SSR запрос пойдёт изнутри контейнера, и туда нужен
      # отдельный адрес `http://api:4000`.
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - build:/app/.next

volumes:
  node_modules:
  build:
  api_node_modules:
