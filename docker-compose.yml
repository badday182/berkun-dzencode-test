services:
  nextjs-app:
    image: nextjs-app
    container_name: nextjs-app
    build:
      context: .
    ports:
      - "3000:3000"
    volumes:
      # Исходники монтируются для hot reload, node_modules и .next остаются
      # в именованных томах — иначе Linux-сборка затирается Windows-хостом.
      - .:/app
      - node_modules:/app/node_modules
      - build:/app/.next

volumes:
  node_modules:
  build:
